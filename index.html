<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#23213e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>一日</title>
<link rel="icon" type="image/svg+xml" href="./sunrise.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;color:#fff7f1;background:#23213e}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;isolation:isolate;--sky-top:#674b70;--sky-bottom:#21203a;--glow:#c4808b;--horizon:#a95d67;--orb:#ffd0a4;--orb-x:78%;--orb-y:16%;--stars:0;background:var(--sky-bottom)}
[data-theme="day"]{--sky-top:#275780;--sky-bottom:#172b51;--glow:#649eb2;--horizon:#347b8c;--orb:#fff6d1;--orb-x:80%;--orb-y:9%}
[data-theme="dusk"]{--sky-top:#493660;--sky-bottom:#231c39;--glow:#a45c82;--horizon:#b66b60;--orb:#ffb379;--orb-x:78%;--orb-y:29%}
[data-theme="night"]{--sky-top:#222b55;--sky-bottom:#11162f;--glow:#465382;--horizon:#343464;--orb:#dde4fb;--orb-x:77%;--orb-y:13%;--stars:.7}
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:radial-gradient(ellipse at var(--orb-x) var(--orb-y),var(--glow),transparent 53%),radial-gradient(ellipse at 15% 61%,var(--horizon),transparent 54%),linear-gradient(165deg,var(--sky-top),var(--sky-bottom) 78%)}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--orb-x) var(--orb-y),var(--orb) 0 24px,transparent 26px);opacity:.68;mask-image:linear-gradient(#000,transparent 65%)}
.sky::after{content:"";position:absolute;inset:0;opacity:var(--stars);background:radial-gradient(circle at 12% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 27% 7%,#fff 0 1px,transparent 2px),radial-gradient(circle at 59% 17%,#fff 0 1px,transparent 2px),radial-gradient(circle at 86% 23%,#fff 0 1px,transparent 2px),radial-gradient(circle at 93% 8%,#fff 0 1px,transparent 2px)}
[data-theme="gold-dawn"]{--sky-top:#664e63;--sky-bottom:#2e2235;--glow:#d89977;--horizon:#b77c66;--orb:#ffe6ac;--orb-x:27%;--orb-y:22%}
[data-theme="sea-day"]{--sky-top:#225c67;--sky-bottom:#132e49;--glow:#5a9f98;--horizon:#358996;--orb:#fff4d2;--orb-x:66%;--orb-y:10%}
[data-theme="violet-dusk"]{--sky-top:#4b365f;--sky-bottom:#201c3d;--glow:#9770b1;--horizon:#ac637e;--orb:#ffd0aa;--orb-x:30%;--orb-y:32%}
[data-theme="indigo-night"]{--sky-top:#30365b;--sky-bottom:#14182e;--glow:#6c528c;--horizon:#385f80;--orb:#e6dcfa;--orb-x:25%;--orb-y:14%;--stars:.85}
[data-theme="rain"]{--sky-top:#384562;--sky-bottom:#171f38;--glow:#6e7d9a;--horizon:#3c5975}
[data-theme="fog"]{--sky-top:#545b73;--sky-bottom:#2a304a;--glow:#9193aa;--horizon:#67748c}
[data-theme="snow"]{--sky-top:#48637f;--sky-bottom:#263553;--glow:#8ea9c5;--horizon:#7086a2}
[data-theme="storm"]{--sky-top:#35294d;--sky-bottom:#18152e;--glow:#7d659c;--horizon:#4e416f}
:is([data-theme="rain"],[data-theme="fog"],[data-theme="snow"],[data-theme="storm"]) .sky::before{background:none}
:is([data-theme="rain"],[data-theme="storm"]) .sky::after{opacity:.25;background:repeating-linear-gradient(112deg,transparent 0 20px,#dbe9ff55 21px,transparent 23px 40px);mask-image:linear-gradient(#000,transparent 85%)}
[data-theme="storm"] .sky::before{background:radial-gradient(ellipse at 72% 24%,#c9a5ff88,transparent 36%);mask-image:none}
[data-theme="fog"] .sky::after{opacity:.6;background:radial-gradient(ellipse at 10% 45%,#e0e2ec65,transparent 40%),radial-gradient(ellipse at 85% 64%,#e0e2ec76,transparent 48%)}
[data-theme="snow"] .sky::after{opacity:.72;background:radial-gradient(circle,#fff 0 1px,transparent 2.5px) 0 0/61px 79px,radial-gradient(circle,#dbecff 0 2px,transparent 3.5px) 24px 14px/109px 127px}
:is([data-theme="day"],[data-theme="sea-day"]) .sky::after{opacity:.48;background:radial-gradient(ellipse at 12% 29%,#ddf1ff88,transparent 27%),radial-gradient(ellipse at 87% 48%,#ddf1ff55,transparent 35%)}
#sky-caption{min-height:1.35em;margin:6px 0 0;color:#fff0e6;font-size:13px}
main{position:relative}
.hero{text-shadow:0 2px 14px #17142c}

main{width:min(100%,480px);margin:auto;padding:max(28px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-size:18px;font-weight:650;letter-spacing:.18em}
.theme-control{display:flex;align-items:center;gap:7px;font-size:13px}
.theme-control select{min-height:44px;padding:0 10px;border:1px solid #ffffff45;border-radius:12px;background:#221e38d9;color:inherit;font:inherit;font-size:16px}
.theme-control select:focus-visible{outline:2px solid #ffcfb6;outline-offset:2px}
.hero{padding:38px 0 28px;text-align:center}
#date{font-size:16px;letter-spacing:.06em}
#clock{font-size:clamp(76px,23vw,114px);font-weight:300;line-height:1.08;letter-spacing:-.07em;font-variant-numeric:tabular-nums;margin:4px 0 7px;display:block}
#greeting{margin:0;color:#ffe5d6;font-size:16px}
.card{border:1px solid #ffffff29;border-radius:24px;background:#201d36a0;padding:17px 19px;margin-bottom:12px}
h2{margin:0;font-size:14px;font-weight:650;color:#ffddcb}
.weather{display:flex;align-items:center;justify-content:space-between;gap:12px}
#condition{margin:7px 0 2px;font-size:16px}
#range{margin:0;font-size:13px;color:#e9d6df}
#temperature{font-size:36px;font-weight:350;white-space:nowrap}
#events{list-style:none;padding:0;margin:0}
#events li{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px;overflow-wrap:anywhere}
#empty{font-size:14px;color:#e9d6df;margin:8px 0 0}
form{display:flex;gap:8px;margin-top:10px}
input,button,a{font:inherit}
input{color:inherit;width:100%;min-width:0;padding:9px 11px;border:1px solid #ffffff45;border-radius:12px;background:#ffffff0c;font-size:16px}
input::placeholder{color:#d8c8d1}
button,a{min-height:44px;border-radius:12px}
button{border:0;padding:0 13px;cursor:pointer;background:#ffcfb6;color:#2c2239;white-space:nowrap}
.remove{background:#ffffff18;color:inherit;font-size:13px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
a{display:grid;place-items:center;background:#ffffff15;border:1px solid #ffffff29;color:inherit;text-decoration:none;font-size:14px}
:focus-visible{outline:2px solid #ffcfb6;outline-offset:2px}
#storage-status{font-size:13px;margin:8px 0 0}
.credit{text-align:right;color:#dfcad6;font-size:11px;margin:10px 0 0}
.credit a{display:inline;min-height:0;border:0;background:none;font-size:inherit;text-decoration:underline}
header .brand{margin-right:auto}
#open-atlas{background:#221e38d9;color:inherit;border:1px solid #ffffff45}
#atlas{width:min(calc(100% - 28px),470px);max-height:85svh;overflow:auto;border:1px solid #ffffff45;border-radius:24px;padding:18px;background:#201e35;color:inherit}
#atlas::backdrop{background:#110d23b5}
.atlas-header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.atlas-header h2{font-size:20px}
#atlas-progress{margin:8px 0;font-weight:650}
#atlas-help{margin:0 0 12px;color:#ebdce6;font-size:13px}
#atlas-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;list-style:none;padding:0;margin:0}
.atlas-entry{border:1px solid #ffffff33;border-radius:14px;overflow:hidden;background:#ffffff0c}
.atlas-swatch{height:65px;position:relative;isolation:isolate;display:grid;place-items:center;background:linear-gradient(135deg,#4b4164,#292640);color:#e6d8ed}
.atlas-swatch .sky{position:absolute}
.atlas-swatch .sky::before{background-size:auto}
.atlas-label{padding:8px;font-size:13px}
.atlas-label strong{display:block}
.atlas-label small{color:#ffddcb}
@media(max-width:360px){header{gap:6px}.theme-control{gap:4px}#open-atlas{padding-inline:9px}}
</style>
</head>
<body data-theme="dawn">
<div class="sky" aria-hidden="true"></div>
<main>
<header>
  <span class="brand">一日</span>
  <button id="open-atlas" type="button">図鑑</button>
  <label class="theme-control">背景
    <select id="theme">
      <option value="auto">自動</option>
      <option value="dawn">朝焼け</option>
      <option value="day">昼の空</option>
      <option value="dusk">夕焼け</option>
      <option value="night">星空</option>
    </select>
  </label>
</header>
<section class="hero" aria-label="日付と時刻">
  <div id="date"></div>
  <time id="clock"></time>
  <p id="greeting"></p>
  <p id="sky-caption"></p>
</section>
<section class="card weather" aria-labelledby="weather-heading">
  <div>
    <h2 id="weather-heading">東京の天気</h2>
    <p id="condition" role="status">取得中…</p>
    <p id="range"></p>
  </div>
  <span id="temperature"></span>
</section>
<section class="card" aria-labelledby="schedule-heading">
  <h2 id="schedule-heading">今日の予定</h2>
  <p id="empty">予定はまだありません</p>
  <ul id="events"></ul>
  <form>
    <input id="event" aria-label="今日の予定を入力" placeholder="予定を入力" maxlength="100" required>
    <button type="submit">追加</button>
  </form>
  <p id="storage-status" role="status" hidden></p>
</section>
<nav aria-label="ショートカット">
  <a href="https://calendar.google.com/">カレンダー</a>
  <a href="https://loilonote.app/_/">ロイロノート</a>
  <a href="https://www.google.com/maps">地図</a>
</nav>
<p class="credit">天気データ提供 <a href="https://open-meteo.com/">Open-Meteo</a></p>
</main>
<dialog id="atlas" aria-labelledby="atlas-title" aria-describedby="atlas-help">
  <div class="atlas-header">
    <h2 id="atlas-title">空の図鑑</h2>
    <form method="dialog"><button type="submit">閉じる</button></form>
  </div>
  <p id="atlas-progress"></p>
  <p id="atlas-help">背景を「自動」にして、時間や天気で現れた空を集めよう。</p>
  <ul id="atlas-list"></ul>
</dialog>
<script>
const byId = id => document.getElementById(id);
const zone = 'Asia/Tokyo';
const dateFormat = new Intl.DateTimeFormat('ja-JP',{timeZone:zone,month:'long',day:'numeric',weekday:'long'});
const clockFormat = new Intl.DateTimeFormat('ja-JP',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const dayFormat = new Intl.DateTimeFormat('ja-JP',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'});
const storageKey = 'home-schedule';
const themePicker = byId('theme');
const themeStorageKey = 'home-theme';
try {
  const savedTheme = localStorage.getItem(themeStorageKey);
  if (Array.from(themePicker.options).some(option => option.value === savedTheme)) {
    themePicker.value = savedTheme;
  }
} catch {
  // The picker still works for the current visit.
}
themePicker.addEventListener('change', () => {
  try {
    localStorage.setItem(themeStorageKey, themePicker.value);
  } catch {
    // Keep the selection for the current visit.
  }
  updateClock();
});

const skies = {
  dawn: ['dawn','gold-dawn'],
  day: ['day','sea-day'],
  dusk: ['dusk','violet-dusk'],
  night: ['night','indigo-night']
};
const skyNames = {
  dawn:'桃色の朝焼け', 'gold-dawn':'金色の朝焼け',
  day:'青空と薄雲', 'sea-day':'青緑の空',
  dusk:'茜色の夕焼け', 'violet-dusk':'すみれ色の夕暮れ',
  night:'月と星', 'indigo-night':'藍色の星空',
  rain:'雨の空', fog:'霧の空', snow:'雪の空', storm:'雷雲の空'
};
const rarity = {
  rain:'レア', fog:'スーパーレア', snow:'スーパーレア', storm:'ウルトラレア'
};
const atlasIds = [...Object.values(skies).flat(), ...Object.keys(rarity)];
const atlasKey = 'home-sky-atlas';
const atlas = byId('atlas');
const foundSkies = new Set();
try {
  const savedSkies = JSON.parse(localStorage.getItem(atlasKey));
  if (Array.isArray(savedSkies)) {
    savedSkies.filter(id => atlasIds.includes(id)).forEach(id => foundSkies.add(id));
  }
} catch {
  // Discoveries remain available for the current visit.
}

function renderAtlas(){
  byId('atlas-progress').textContent = foundSkies.size + ' / ' + atlasIds.length + ' 種類発見';
  byId('atlas-list').replaceChildren(...atlasIds.map(id => {
    const found = foundSkies.has(id);
    const entry = document.createElement('li');
    entry.className = 'atlas-entry';
    const swatch = document.createElement('div');
    swatch.className = 'atlas-swatch';
    swatch.setAttribute('aria-hidden','true');
    if (found) {
      swatch.dataset.theme = id;
      const sky = document.createElement('div');
      sky.className = 'sky';
      swatch.append(sky);
    } else {
      swatch.textContent = '？';
    }
    const label = document.createElement('div');
    label.className = 'atlas-label';
    const name = document.createElement('strong');
    name.textContent = found ? skyNames[id] : '未発見';
    const grade = document.createElement('small');
    grade.textContent = rarity[id] ?? 'ノーマル';
    label.append(name,grade);
    entry.append(swatch,label);
    return entry;
  }));
}

function discoverSky(id){
  if (foundSkies.has(id)) return;
  foundSkies.add(id);
  try {
    localStorage.setItem(atlasKey, JSON.stringify([...foundSkies]));
  } catch {
    // Discoveries remain available for the current visit.
  }
  if (atlas.open) renderAtlas();
}

byId('open-atlas').addEventListener('click', () => {
  renderAtlas();
  atlas.showModal();
});

let weatherReading = null;

function timeBand(hour){
  if (hour >= 5 && hour < 10) return 'dawn';
  if (hour >= 10 && hour < 16) return 'day';
  if (hour >= 16 && hour < 19) return 'dusk';
  return 'night';
}

function weatherSky(code){
  if ([95,96,99].includes(code)) return 'storm';
  if ([71,73,75,77,85,86].includes(code)) return 'snow';
  if ([45,48].includes(code)) return 'fog';
  if ([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rain';
  return null;
}

function automaticSky(hour, timestamp, weather){
  const special = weather && timestamp < weather.expiresAt && weatherSky(weather.code);
  if (special) return special;
  const band = timeBand(hour);
  const tokyoDay = Math.floor((timestamp + 9 * 60 * 60 * 1000) / 86400000);
  return skies[band][(tokyoDay + Object.keys(skies).indexOf(band)) % skies[band].length];
}

let day = '';
let events = [];

function showEvents(){
  byId('empty').hidden = events.length > 0;
  byId('events').replaceChildren(...events.map((event,index)=>{
    const item = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = event;
    const remove = document.createElement('button');
    remove.textContent = '削除';
    remove.className = 'remove';
    remove.setAttribute('aria-label',event + 'を削除');
    remove.addEventListener('click',()=>{
      events.splice(index,1);
      saveEvents();
    });
    item.append(label,remove);
    return item;
  }));
}

function storageUnavailable(){
  const status = byId('storage-status');
  status.hidden = false;
  status.textContent = 'このブラウザでは、予定を閉じたあとに保存できません。';
}

function saveEvents(){
  try {
    localStorage.setItem(storageKey, JSON.stringify({day,events}));
  } catch {
    storageUnavailable();
  }
  showEvents();
}

function updateClock(){
  const now = new Date();
  const time = clockFormat.format(now);
  const hour = Number(time.slice(0,2));
  const theme = themePicker.value === 'auto' ? automaticSky(hour, now.getTime(), weatherReading) : themePicker.value;
  if (document.body.dataset.theme !== theme) document.body.dataset.theme = theme;
  if (themePicker.value === 'auto') discoverSky(theme);
  const caption = byId('sky-caption');
  if (caption.textContent !== skyNames[theme]) caption.textContent = skyNames[theme];
  byId('clock').textContent = time;
  byId('clock').dateTime = time + '+09:00';
  byId('date').textContent = dateFormat.format(now);
  byId('greeting').textContent = hour < 11 ? 'おはようございます' : hour < 18 ? 'こんにちは' : 'こんばんは';
  const today = dayFormat.format(now);
  if (day === today) return;
  day = today;
  events = [];
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey));
    if (saved?.day === day && Array.isArray(saved.events)) events = saved.events.filter(value=>typeof value === 'string');
  } catch {
    storageUnavailable();
  }
  showEvents();
}

byId('event').form.addEventListener('submit',event=>{
  event.preventDefault();
  updateClock();
  const input = byId('event');
  const value = input.value.trim();
  if (!value) return;
  events.push(value);
  input.value = '';
  saveEvents();
});

function weatherLabel(code){
  if (code === 0) return '快晴';
  if (code <= 2) return '晴れ';
  if (code === 3) return 'くもり';
  if (code <= 48) return '霧';
  if (code <= 67 || (code >= 80 && code <= 82)) return '雨';
  if (code <= 86) return '雪';
  return '雷雨';
}

async function updateWeather(){
  const params = new URLSearchParams({
    latitude:'35.68',longitude:'139.76',timezone:zone,forecast_days:'1',
    current:'temperature_2m,weather_code',daily:'temperature_2m_min,temperature_2m_max'
  });
  try {
    const response = await fetch('https://api.open-meteo.com/v1/forecast?' + params,{signal:AbortSignal.timeout(8000)});
    if (!response.ok) throw new Error('Weather unavailable');
    const {current,daily} = await response.json();
    const values = [current.weather_code,current.temperature_2m,daily.temperature_2m_max[0],daily.temperature_2m_min[0]];
    if (!values.every(Number.isFinite)) throw new Error('Incomplete weather');
    const [code,temp,max,min] = values;
    weatherReading = {code, expiresAt: Date.now() + 30 * 60 * 1000};
    updateClock();
    byId('condition').textContent = weatherLabel(code);
    byId('temperature').textContent = Math.round(temp) + '℃';
    byId('range').textContent = '最高 ' + Math.round(max) + '℃ ／ 最低 ' + Math.round(min) + '℃';
  } catch {
    byId('condition').textContent = '天気を取得できませんでした';
    byId('temperature').textContent = '';
    byId('range').textContent = '';
  }
}

updateClock();
setInterval(updateClock,1000);
updateWeather();
setInterval(updateWeather,15 * 60 * 1000);
</script>
</body>
</html>
